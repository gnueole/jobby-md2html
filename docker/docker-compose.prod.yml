name: n8n-eole-prod

services:
  # Initialisation des droits pour le certificat SSL (indispensable après un dump/restore)
  traefik-acme-init:
    image: alpine:3.20
    container_name: traefik-acme-init
    command: >
      sh -lc "mkdir -p /letsencrypt &&
              touch /letsencrypt/acme.json &&
              chmod 600 /letsencrypt/acme.json"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Le "Videur" de ton infrastructure
  traefik:
    image: traefik:latest
    container_name: traefik-n8n
    restart: unless-stopped
    depends_on:
      - traefik-acme-init
    ports:
      - "80:80"
      - "443:443"
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # Ton nouveau serveur MCP pour Notion
  # Note : n8n l'appellera via http://mcp-notion:3000
  mcp-notion:
    image: mcp/notion:latest 
    container_name: mcp-notion
    restart: unless-stopped
    command: --transport http --disable-auth
    environment:
      - NOTION_TOKEN=${NOTION_API_KEY:-$NOTION_TOKEN}
      - TZ=${TZ}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Le moteur de rendu PDF (Gotenberg)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    environment:
      - GOTENBERG_CHROMIUM_DISABLE_JAVASCRIPT=true
      - GOTENBERG_ALLOW_LIST_ACCESS_LOCAL_FILES=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # n8n en version 2.25.2 avec support IA et MCP
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.25.2
    container_name: n8n-server
    restart: unless-stopped
    depends_on:
      - traefik
      - mcp-notion
      - gotenberg
    environment:
      - TZ=${TZ}
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN_NAME}/
      - N8N_SECURE_COOKIE=true
      - NODE_OPTIONS=--max-old-space-size=2048
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M

  # Jobby ATS Markdown Resume Editor
  jobby-editor:
    image: ghcr.io/gnueole/jobby-md2html:latest
    container_name: jobby-editor
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      - PORT=3000
      - NODE_ENV=production
      - N8N_WEBHOOK_TOKEN=${X_N8N_TOKEN}
      - X_N8N_TOKEN=${X_N8N_TOKEN}
      - GOOGLE_TAG_ID=${GOOGLE_TAG_ID:-}
      - N8N_TELEMETRY_WEBHOOK_URL=${N8N_TELEMETRY_WEBHOOK_URL:-}
      - N8N_FEEDBACK_WEBHOOK_URL=${N8N_FEEDBACK_WEBHOOK_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.jobby.rule=Host(`cv.eole.me`)
      - traefik.http.routers.jobby.entrypoints=websecure
      - traefik.http.routers.jobby.tls=true
      - traefik.http.routers.jobby.tls.certresolver=letsencrypt
      - traefik.http.services.jobby.loadbalancer.server.port=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Vector Log Shipper to Axiom
  vector:
    image: ghcr.io/gnueole/jobby-md2html-vector:latest
    container_name: vector
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - AXIOM_TOKEN=${AXIOM_TOKEN}
      - AXIOM_DATASET=${AXIOM_DATASET}
      - COMPOSE_PROJECT_NAME=n8n-eole-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  traefik_letsencrypt:
  n8n_data:
