name: jobby-prod

services:
  # Ton nouveau serveur MCP pour Notion
  # Note : n8n l'appellera via http://mcp-notion:3000
  mcp-notion:
    image: mcp/notion:latest 
    container_name: mcp-notion
    restart: unless-stopped
    command: --transport http --disable-auth
    environment:
      - NOTION_TOKEN=${NOTION_API_KEY:-$NOTION_TOKEN}
      - TZ=${TZ}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Le moteur de rendu PDF (Gotenberg)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    environment:
      - GOTENBERG_CHROMIUM_DISABLE_JAVASCRIPT=true
      - GOTENBERG_ALLOW_LIST_ACCESS_LOCAL_FILES=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Jobby ATS Markdown Resume Editor
  jobby-editor:
    image: ghcr.io/gnueole/jobby-md2html:latest
    container_name: jobby-editor
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - N8N_WEBHOOK_TOKEN=${X_N8N_TOKEN}
      - X_N8N_TOKEN=${X_N8N_TOKEN}
      - GOOGLE_TAG_ID=${GOOGLE_TAG_ID:-}
      - N8N_TELEMETRY_WEBHOOK_URL=${N8N_TELEMETRY_WEBHOOK_URL:-}
      - N8N_FEEDBACK_WEBHOOK_URL=${N8N_FEEDBACK_WEBHOOK_URL:-https://n8n.eole.me/webhook/feedback}
      - VECTOR_TELEMETRY_URL=${VECTOR_TELEMETRY_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobby.rule=Host(`${JOBBY_SUBDOMAIN:-jobby}.${ROOT_DOMAIN:-eole.me}`)"
      - "traefik.http.routers.jobby.entrypoints=websecure"
      - "traefik.http.routers.jobby.tls=true"
      - "traefik.http.routers.jobby.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobby.loadbalancer.server.port=3000"
      
      # Redirection from cv.yourdomain.com -> jobby.yourdomain.com
      - "traefik.http.routers.jobby-redirect.rule=Host(`${JOBBY_REDIRECT_SUBDOMAIN:-cv}.${ROOT_DOMAIN:-eole.me}`)"
      - "traefik.http.routers.jobby-redirect.entrypoints=websecure"
      - "traefik.http.routers.jobby-redirect.tls=true"
      - "traefik.http.routers.jobby-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jobby-redirect.middlewares=cv-to-jobby-redirect"
      - "traefik.http.middlewares.cv-to-jobby-redirect.redirectregex.regex=^https?://${JOBBY_REDIRECT_SUBDOMAIN:-cv}.${ROOT_DOMAIN:-eole.me}/(.*)"
      - "traefik.http.middlewares.cv-to-jobby-redirect.redirectregex.replacement=https://${JOBBY_SUBDOMAIN:-jobby}.${ROOT_DOMAIN:-eole.me}/$$1"
      - "traefik.http.middlewares.cv-to-jobby-redirect.redirectregex.permanent=true"

      # Vector Log Ingestion
      - "vector.dev/collect=true"
      - "vector.dev/dataset=${AXIOM_DATASET:-jobby}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-eole_shared_network}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
