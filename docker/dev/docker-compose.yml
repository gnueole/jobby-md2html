services:
  # Jobby ATS Markdown Resume Editor
  jobby-editor-dev:
    image: node:20-alpine
    container_name: jobby-editor-dev
    working_dir: /app
    volumes:
      - ../../:/app
    ports:
      # Bound to 127.0.0.1 to comply with local security testing guidelines
      - "127.0.0.1:3000:3000"
    command: node server.js
    env_file:
      - ../../.env.dev
    environment:
      - NODE_ENV=development

  # Gotenberg PDF Rendering Engine
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg-dev
    restart: unless-stopped
    environment:
      - GOTENBERG_CHROMIUM_DISABLE_JAVASCRIPT=true
      - GOTENBERG_ALLOW_LIST_ACCESS_LOCAL_FILES=false

  # Notion MCP Server
  mcp-notion:
    image: mcp/notion:latest
    container_name: mcp-notion-dev
    restart: unless-stopped
    command: --transport http --disable-auth
    env_file:
      - ../../.env.dev

  # n8n Automation Server (v2.21.0 with AI & MCP support)
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.21.0
    container_name: n8n-server-dev
    restart: unless-stopped
    depends_on:
      - gotenberg
      - mcp-notion
    ports:
      # Bound to 127.0.0.1 to satisfy local testing security guidelines
      - "127.0.0.1:5678:5678"
    env_file:
      - ../../.env.dev
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - n8n_data_dev:/home/node/.n8n

volumes:
  n8n_data_dev:
