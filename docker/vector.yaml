sources:
  docker_logs:
    type: "docker_logs"
    exclude_containers:
      - "vector"

  http_telemetry:
    type: "http"
    address: "0.0.0.0:8080"
    decoding:
      codec: "json"

transforms:
  # Opt in by label, not by compose project. The previous condition matched
  # `com.docker.compose.project == eole-infra`, so only n8n and traefik ever
  # shipped: jobby, www, trail-mapper and backdrop-studio all declared
  # `vector.dev/collect=true` and were silently dropped, because nothing read
  # that label. ARCHITECTURE.md documented the label mechanism as the way this
  # works — it now is.
  #
  # `vector.dev/dataset` is deliberately NOT honoured: everything goes to one
  # log dataset, and the project is a field (container_name,
  # label."com.docker.compose.project"), not a dataset. Splitting per project
  # would cost a query per project to answer "what happened at 20:15", which is
  # exactly the question that matters when a chain spans several of them.
  filter_project_logs:
    type: "filter"
    inputs:
      - "docker_logs"
    condition: '.label."vector.dev/collect" == "true"'

  # La télémétrie partait de la source HTTP directement au sink : rien ne la
  # normalisait, et chaque application avait donc choisi son propre vocabulaire.
  # Sur 552 évènements, le nom de l'évènement vivait sous quatre champs —
  # eventType (jobby, 450), event_type (trail-mapper, improv, 55), event
  # (sc2-build-order, 41), action (reservoir_idees, jobby_ats, 6) — et
  # l'application sous deux, `application` et `service`. Un tableau de bord lisant
  # `action` était donc vide à 98,9 %.
  #
  # Le contrat, désormais tenu ici quel que soit l'émetteur, y compris ceux qui
  # n'existent pas encore : `event_type` en snake_case, et `application`.
  #
  # Les champs d'origine ne sont PAS supprimés. Pendant la migration des
  # applications, un tableau de bord encore branché sur `eventType` continue de
  # fonctionner ; et rien de ce qui a été émis n'est perdu en route.
  normalize_telemetry:
    type: "remap"
    inputs:
      - "http_telemetry"
    source: |
      name = null
      if exists(.event_type) { name = .event_type
      } else if exists(.eventType) { name = .eventType
      } else if exists(.event) { name = .event
      } else if exists(.action) { name = .action }

      # downcase + underscores : "Session Start" (jobby) et "session_start"
      # (trail-mapper) sont le même évènement et doivent se regrouper.
      if name != null {
        .event_type = downcase(replace(to_string(name) ?? "", " ", "_"))
      }

      if !exists(.application) && exists(.service) {
        .application = .service
      }

sinks:
  axiom_sink:
    type: "http"
    inputs:
      - "filter_project_logs"
    uri: "https://eu-central-1.aws.edge.axiom.co/v1/ingest/${AXIOM_DATASET}"
    encoding:
      codec: "json"
    request:
      headers:
        Authorization: "Bearer ${AXIOM_TOKEN}"
        Content-Type: "application/json"

  axiom_telemetry_sink:
    type: "http"
    inputs:
      # Passe par la normalisation, plus par la source brute.
      - "normalize_telemetry"
    # Fallback names a dataset that exists — a deleted one means a silent 404.
    uri: "https://eu-central-1.aws.edge.axiom.co/v1/ingest/${AXIOM_TELEMETRY_DATASET:-eole-telemetry}"
    encoding:
      codec: "json"
    request:
      headers:
        Authorization: "Bearer ${AXIOM_TOKEN}"
        Content-Type: "application/json"
