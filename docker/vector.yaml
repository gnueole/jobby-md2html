sources:
  docker_logs:
    type: "docker_logs"
    exclude_containers:
      - "vector"
    # A stack trace used to arrive as one event per line: an n8n webhook error
    # was 6 events, an improv DOMException about 15, and each fragment counted
    # towards the "Error spike" monitor on its own. Any line that starts with
    # whitespace continues the event above it — Node's "    at …" frames,
    # Python's "  File …" frames, the fields of a dumped object. No access-log
    # or application line starts with whitespace, so nothing else is merged.
    multiline:
      start_pattern: '^\S'
      mode: "continue_through"
      condition_pattern: '^\s'
      timeout_ms: 1000

  http_telemetry:
    type: "http"
    address: "0.0.0.0:8080"
    decoding:
      codec: "json"

transforms:
  # Opt in by label, not by compose project. The previous condition matched
  # `com.docker.compose.project == eole-infra`, so only n8n and traefik ever
  # shipped: jobby, www, trail-mapper and backdrop-studio all declared
  # `vector.dev/collect=true` and were silently dropped, because nothing read
  # that label. ARCHITECTURE.md documented the label mechanism as the way this
  # works — it now is.
  #
  # `vector.dev/dataset` is deliberately NOT honoured: everything goes to one
  # log dataset, and the project is a field (container_name,
  # label."com.docker.compose.project"), not a dataset. Splitting per project
  # would cost a query per project to answer "what happened at 20:15", which is
  # exactly the question that matters when a chain spans several of them.
  filter_project_logs:
    type: "filter"
    inputs:
      - "docker_logs"
    condition: '.label."vector.dev/collect" == "true"'

  # Visitor IP addresses are personal data, and every nginx access line (www,
  # backdrop-studio) ended with the real one, taken from X-Forwarded-For. They
  # are truncated here, before anything leaves the VPS: the last IPv4 octet
  # becomes 0, an IPv6 address keeps its first three groups (the /48). Enough
  # to tell a scan from a visitor, not enough to name anyone.
  #
  # Only the last quoted field of nginx's combined format is touched; the first
  # address of the line is Traefik's internal one. Traefik's own access log
  # carries no client address at all: eoleme-infra drops those fields at the
  # source, so its privacy does not depend on this image being deployed first.
  anonymize_client_ips:
    type: "remap"
    inputs:
      - "filter_project_logs"
    source: |
      if is_string(.message) {
        msg = string!(.message)
        if match(msg, r'^\S+ - \S+ \[') {
          parts, err = parse_regex(msg, r'^(?P<head>.*")(?P<xff>[^"]*)"$')
          if err == null {
            kept = []
            for_each(split(string!(parts.xff), ",")) -> |_index, ip| {
              ip = strip_whitespace(ip)
              mask = if contains(ip, ":") { "/48" } else { "/24" }
              kept = push(kept, ip_subnet(ip, mask) ?? ip)
            }
            msg = string!(parts.head) + join!(kept, ", ") + "\""
          }
        }
        .message = msg
      }

  # La télémétrie partait de la source HTTP directement au sink : rien ne la
  # normalisait, et chaque application avait donc choisi son propre vocabulaire.
  # Sur 552 évènements, le nom de l'évènement vivait sous quatre champs —
  # eventType (jobby, 450), event_type (trail-mapper, improv, 55), event
  # (sc2-build-order, 41), action (reservoir_idees, jobby_ats, 6) — et
  # l'application sous deux, `application` et `service`. Un tableau de bord lisant
  # `action` était donc vide à 98,9 %.
  #
  # Le contrat, désormais tenu ici quel que soit l'émetteur, y compris ceux qui
  # n'existent pas encore : `event_type` en snake_case, et `application`.
  #
  # Les champs d'origine ne sont PAS supprimés. Pendant la migration des
  # applications, un tableau de bord encore branché sur `eventType` continue de
  # fonctionner ; et rien de ce qui a été émis n'est perdu en route.
  normalize_telemetry:
    type: "remap"
    inputs:
      - "http_telemetry"
    source: |
      name = null
      if exists(.event_type) { name = .event_type
      } else if exists(.eventType) { name = .eventType
      } else if exists(.event) { name = .event
      } else if exists(.action) { name = .action }

      # downcase + underscores : "Session Start" (jobby) et "session_start"
      # (trail-mapper) sont le même évènement et doivent se regrouper.
      if name != null {
        .event_type = downcase(replace(to_string(name) ?? "", " ", "_"))
      }

      if !exists(.application) && exists(.service) {
        .application = .service
      }

      # One word for production. Four apps spelled it three ways (prod, prd,
      # production), so "prod only" was a three-value filter nobody got right.
      if exists(.environment) {
        env = downcase(to_string(.environment) ?? "")
        if includes(["prod", "prd", "production"], env) {
          .environment = "prod"
        } else if includes(["dev", "development", "local"], env) {
          .environment = "dev"
        }
      }

sinks:
  axiom_sink:
    type: "http"
    inputs:
      - "anonymize_client_ips"
    uri: "https://eu-central-1.aws.edge.axiom.co/v1/ingest/${AXIOM_DATASET}"
    encoding:
      codec: "json"
    request:
      headers:
        Authorization: "Bearer ${AXIOM_TOKEN}"
        Content-Type: "application/json"

  axiom_telemetry_sink:
    type: "http"
    inputs:
      # Passe par la normalisation, plus par la source brute.
      - "normalize_telemetry"
    # Fallback names a dataset that exists — a deleted one means a silent 404.
    uri: "https://eu-central-1.aws.edge.axiom.co/v1/ingest/${AXIOM_TELEMETRY_DATASET:-eole-telemetry}"
    encoding:
      codec: "json"
    request:
      headers:
        Authorization: "Bearer ${AXIOM_TOKEN}"
        Content-Type: "application/json"
