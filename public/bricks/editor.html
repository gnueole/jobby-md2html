<div class="panel-header">
    <div class="header-left">
        <span class="status-indicator markdown-dot">✍ MARKDOWN (EDITABLE)</span>
        <label class="syntax-toggle" title="Toggle syntax highlighting in editor">
            <input type="checkbox" id="cb-syntax-highlight" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-label">Syntax Color</span>
        </label>
        <div class="shortcut-tooltip-container">
            <button class="btn-circle-sm shortcut-help-btn" title="Keyboard Shortcuts Help" type="button">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </button>
            <div class="shortcut-tooltip-dropdown">
                <h4>Editor Shortcuts</h4>
                <ul>
                    <li><kbd>Ctrl + B</kbd> <span>Bold</span></li>
                    <li><kbd>Ctrl + I</kbd> <span>Italic</span></li>
                    <li><kbd>Ctrl + K</kbd> <span>Insert Link</span></li>
                    <li><kbd>Ctrl + E</kbd> <span>Accent Color</span></li>
                    <li><kbd>Ctrl + M</kbd> <span>Muted Text</span></li>
                    <li><kbd>Ctrl + 1/2/3</kbd> <span>H1/H2/H3 Headings</span></li>
                    <li><kbd>Ctrl + ▲/▼</kbd> <span>Move Line / Section</span></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <button id="btn-load-sample" class="btn-icon" title="Load sample: Julien Avarre">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
            </svg>
            Sample
        </button>
        <button id="btn-copy-md" class="btn-icon" title="Copy Markdown to clipboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            Copy
        </button>
        <button id="btn-clear" class="btn-icon text-danger" title="Clear editor">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <polyline points="3 6 5 6 21 6" />
                <path
                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
            Clear
        </button>
    </div>
</div>
<div class="editor-container">
    <div class="textarea-syntax-wrapper syntax-active">
        <pre id="markdown-highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
        <textarea id="markdown-input" spellcheck="false" placeholder="# YOUR NAME..."></textarea>
    </div>
</div>
<div class="panel-footer">
    <span id="char-word-count">Words: 0 | Characters: 0</span>
</div>
