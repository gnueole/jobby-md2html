<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobby Sync Webhook Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #7c3aed;
            --accent-hover: #9061f9;
            --accent-glow: rgba(124, 58, 237, 0.15);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* Loading Spinner */
        .spinner-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(124, 58, 237, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success & Error State Visuals */
        .status-icon {
            display: none;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .status-icon svg {
            width: 40px;
            height: 40px;
        }

        .success-icon {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--success);
            color: var(--success);
            box-shadow: 0 0 20px var(--success-glow);
        }

        .danger-icon {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--danger);
            color: var(--danger);
            box-shadow: 0 0 20px var(--danger-glow);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status-message {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-primary);
            min-height: 48px;
        }

        .status-details {
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            text-align: left;
            font-family: monospace;
            word-break: break-all;
            display: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all var(--transition-speed, 0.2s) ease;
            text-decoration: none;
            font-family: var(--font-ui);
            width: 100%;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="header">
            <h1 id="title-text">Jobby LinkedIn Sync</h1>
            <p id="subtitle-text">Scraping job to Notion pipeline</p>
        </div>

        <div class="spinner-wrapper" id="spinner-wrapper">
            <div class="spinner"></div>
        </div>

        <!-- Success SVG Icon -->
        <div class="status-icon success-icon" id="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Danger SVG Icon -->
        <div class="status-icon danger-icon" id="danger-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>

        <div class="status-message" id="status-message">
            Initializing connection to n8n...
        </div>

        <div class="status-details" id="status-details"></div>

        <button class="btn btn-primary" id="btn-close" onclick="window.close()" style="display: none;">Close Window</button>
        <button class="btn btn-secondary" id="btn-retry" onclick="window.location.reload()" style="margin-top: 10px;">Retry Sync</button>
    </div>

    <script>
        async function runSync() {
            const params = new URLSearchParams(window.location.search);
            const webhookUrl = params.get('webhookUrl');
            const token = params.get('token');
            
            const jobTitle = params.get('job_title') || '';
            const company = params.get('company') || '';
            const jobUrl = params.get('job_url') || '';
            const jobDescription = params.get('job_description') || '';

            const statusMsg = document.getElementById('status-message');
            const spinnerWrapper = document.getElementById('spinner-wrapper');
            const successIcon = document.getElementById('success-icon');
            const dangerIcon = document.getElementById('danger-icon');
            const btnClose = document.getElementById('btn-close');
            const btnRetry = document.getElementById('btn-retry');
            const statusDetails = document.getElementById('status-details');

            if (!webhookUrl) {
                showError("Configuration Missing", "No Webhook URL was supplied. Make sure you configured the Webhook URL in Jobby Developer Tools.");
                return;
            }

            statusMsg.textContent = "Syncing job details to Notion...";

            try {
                // Construct Webhook URL with query parameters containing job info (matches n8n parameter expectation)
                const urlObj = new URL(webhookUrl);
                urlObj.searchParams.set('job_title', jobTitle);
                urlObj.searchParams.set('company', company);
                urlObj.searchParams.set('job_url', jobUrl);
                urlObj.searchParams.set('job_description', jobDescription);

                // Set headers for authentication
                const headers = {
                    'Accept': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                // Perform the GET request to n8n
                const response = await fetch(urlObj.toString(), {
                    method: 'GET',
                    headers: headers
                });

                if (response.ok) {
                    let bodyData = null;
                    let isWorkflowError = false;
                    let errorDetails = '';
                    
                    try {
                        const rawText = await response.text();
                        try {
                            bodyData = JSON.parse(rawText);
                        } catch (jsonErr) {
                            // If it's not JSON, check if the raw text contains error indications
                            if (rawText.toLowerCase().includes('error') || rawText.toLowerCase().includes('failed')) {
                                isWorkflowError = true;
                                errorDetails = rawText;
                            }
                        }
                    } catch (readErr) {}

                    if (bodyData) {
                        // Check for error or message indicating node failure (e.g. from Stop and Error node)
                        if (bodyData.error || bodyData.message) {
                            isWorkflowError = true;
                            errorDetails = bodyData.message || bodyData.error;
                            if (typeof errorDetails === 'object') {
                                errorDetails = JSON.stringify(errorDetails);
                            }
                        }
                    }

                    if (isWorkflowError) {
                        showError("Workflow Execution Failed", "The n8n workflow encountered a node error during execution.", errorDetails);
                        return;
                    }

                    // Success!
                    spinnerWrapper.style.display = 'none';
                    successIcon.style.display = 'flex';
                    statusMsg.innerHTML = "<strong>Success!</strong><br><span style='font-size: 13px; color: var(--text-secondary);'>Job details matched & synced to Notion.</span>";
                    btnClose.style.display = 'flex';
                    btnRetry.style.display = 'none';

                    // Auto-close after 1.5 seconds
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                } else {
                    let errBody = '';
                    try {
                        errBody = await response.text();
                    } catch (e) {}

                    if (response.status === 401) {
                        showError("Authorization Failed", "The n8n webhook rejected the request. Please check that your 'Security Token' in Jobby Developer Tools matches the token configured on n8n.", errBody);
                    } else {
                        showError(`Server Error (${response.status})`, "The n8n server returned an error during job synchronization.", errBody);
                    }
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Connection Failed", "Unable to connect to the n8n webhook. Make sure n8n is running and accessible (or that your local dev docker container is running). Check your browser console for details.", err.message);
            }
        }

        function showError(title, msg, details) {
            document.getElementById('spinner-wrapper').style.display = 'none';
            document.getElementById('success-icon').style.display = 'none';
            document.getElementById('danger-icon').style.display = 'flex';
            
            const statusMsg = document.getElementById('status-message');
            statusMsg.innerHTML = `<strong>${title}</strong><br><span style="font-size: 13px; color: #fca5a5;">${msg}</span>`;
            
            if (details) {
                const statusDetails = document.getElementById('status-details');
                statusDetails.textContent = details;
                statusDetails.style.display = 'block';
            }

            document.getElementById('btn-close').style.display = 'flex';
            document.getElementById('btn-retry').style.display = 'flex';
        }

        // Start execution
        window.addEventListener('DOMContentLoaded', runSync);
    </script>
</body>
</html>
