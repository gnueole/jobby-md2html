<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script>
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            fetch('/api/config')
                .then(res => res.json())
                .then(config => {
                    if (config.GOOGLE_TAG_ID && /^G-[A-Z0-9]+$/.test(config.GOOGLE_TAG_ID)) {
                        const script = document.createElement('script');
                        script.async = true;
                        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + config.GOOGLE_TAG_ID;
                        document.head.appendChild(script);

                        window.dataLayer = window.dataLayer || [];
                        window.gtag = function() { dataLayer.push(arguments); };
                        gtag('js', new Date());
                        gtag('config', config.GOOGLE_TAG_ID);
                    }
                })
                .catch(err => {
                    // Fail silently in development/offline modes
                });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jobby MD Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22><rect x=%223%22 y=%227%22 width=%2218%22 height=%2213%22 rx=%222%22 fill=%22%2378350f%22/><path d=%22M9 7V5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7%22 stroke=%22%23451a03%22 stroke-width=%222%22 stroke-linecap=%22round%22/><rect x=%225%22 y=%2210%22 width=%2214%22 height=%227%22 rx=%221%22 fill=%22%23451a03%22/><rect x=%227%22 y=%227%22 width=%222%22 height=%2213%22 fill=%22%23b45309%22/><rect x=%2215%22 y=%227%22 width=%222%22 height=%2213%22 fill=%22%23b45309%22/><rect x=%2211%22 y=%2212%22 width=%222%22 height=%222%22 rx=%220.5%22 fill=%22%23facc15%22/></svg>">
    <!-- Google Fonts for app UI and resume rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Raleway:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=1.8.2">
    <link rel="stylesheet" href="templates.css?v=1.8.2">
    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- HEADER / TOP BAR -->
        <header id="header-container" class="app-header"></header>

        <!-- DASHBOARD GRID -->
        <main class="app-main">
            <!-- COLUMN 1: MARKDOWN EDITOR -->
            <div id="editor-container" class="panel editor-panel"></div>

            <div class="resize-handle" id="handle-left"></div>

            <!-- COLUMN 2: LIVE PREVIEW -->
            <div id="preview-container" class="panel preview-panel"></div>

            <div class="resize-handle" id="handle-right"></div>

            <!-- COLUMN 3: CUSTOMIZER & EXPORT -->
            <div id="controls-container" class="panel controls-panel"></div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Code copied to clipboard!</div>
    
    <!-- Folded Controls Dock -->
    <div id="folded-controls-dock" class="folded-controls-dock hidden">
        <button id="btn-unfold-design-panel" class="floating-unfold-btn" title="Show Design Panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Design</span>
        </button>
    </div>

    <!-- About Modal Overlay -->
    <div id="about-modal" class="modal-overlay"></div>
    
    <!-- Help Modal Overlay -->
    <div id="help-modal" class="modal-overlay"></div>
    
    <!-- Developer Tools Modal Overlay -->
    <div id="developer-modal" class="modal-overlay"></div>

    <script type="module" src="app.js?v=1.8.2"></script>
</body>

</html>
